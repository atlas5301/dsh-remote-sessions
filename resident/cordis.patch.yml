# Compose AFTER dsh-base, never web/headless/acp/sdk app bundles.
# No network listener or remote frontend is installed by this bundle.
- id: hmr
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search
- id: system-prompt
  config:
    personaPrefix: You are a coding agent powered by the {{model}} model.
    personaSuffix: Your working directory is {{cwd}}. This agent runs on the resident runtime machine, independently of connected user interfaces.
- insert:
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
      config:
        nativeOpen: false
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'
    # Remote file-tree and terminal forwarding: the resident exposes the same
    # Host services the local UI already speaks; the plugin forwards calls.
    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'
      config:
        unattendedTimeoutMs: 7200000
    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'
    - id: remote-resident
      name: ./lib/companion.js
      config:
        runtimeDirectory: !!js "process.env.DSH_REMOTE_RUNTIME_DIR"
